<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../font/css/NotoSansKR.css">
    <link rel="stylesheet" href="../css/pretendardvariable.css">
    <link rel="stylesheet" href="css/sulbing.css">
    <link rel="stylesheet" href="css/theme-selector.css">
    <link id="theme-style" rel="stylesheet" href="css/claymorphism.css">
<title>설빙 로그인</title>
</head>
<body>
    <div id="wrap" class="claymorphism">
        <div class="theme_switcher">
            <label for="theme-select">디자인 테마</label>
            <select id="theme-select" aria-label="디자인 테마 선택">
                <option value="neo-brutalism">NEO Brutalism</option>
                <option value="pixel-art">Pixel Art</option>
                <option value="claymorphism" selected>Claymorphism</option>
                <option value="glassmorphism">Glassmorphism</option>
            </select>
        </div>
        <header class="login_header">
            <button type="button" class="back_btn">
                <img src="img/back.svg" alt="뒤로가기">
            </button>
        </header>

        <main>
            <div class="brand_area">
                <img class="brand_logo_en" src="img/SULBING1.svg" alt="SULBING">
                <img class="brand_logo" src="img/SuLBING-LOGO.svg" alt="설빙">
            </div>

            <section class="login_content">
                <h1 class="sr-only">설빙 로그인</h1>

                <form class="login_form">
                    <fieldset>
                        <legend class="sr-only">이메일 로그인</legend>

                        <div class="input_group">
                            <label for="user-email">이메일 로그인</label>
                            <input
                                type="email"
                                id="user-email"
                                name="user-email"
                                placeholder="아이디(이메일)을 입력해 주세요."
                                autocomplete="email">

                            <div class="password_box">
                                <input
                                    type="password"
                                    id="user-password"
                                    name="user-password"
                                    placeholder="비밀번호를 입력해 주세요."
                                    autocomplete="current-password"
                                    aria-label="비밀번호"
                                >
                                <div class="password_actions">
                                    <button type="button" class="eye_btn" aria-label="비밀번호 보기">
                                        <img src="img/Removeredeye.svg" alt="">
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="login_actions">
                            <div class="option_list">
                                <label class="check_item">
                                    <input type="checkbox" name="auto-login">
                                    <span class="check_box"></span>
                                    <span>자동 로그인</span>
                                </label>

                                <label class="check_item">
                                    <input type="checkbox" name="save-id">
                                    <span class="check_box"></span>
                                    <span>아이디 저장</span>
                                </label>
                            </div>

                            <button type="submit" class="login_btn" disabled>
                                로그인
                            </button>

                            <nav class="account_links" aria-label="계정 메뉴">
                                <a href="#">아이디 찾기</a>
                                <span class="link_line" aria-hidden="true"></span>
                                <a href="#">비밀번호 재설정</a>
                                <span class="link_line" aria-hidden="true"></span>
                                <a href="#">회원가입</a>
                            </nav>
                        </div>
                    </fieldset>
                </form>
            </section>

            <section class="sns_login">
                <div class="sns_title">
                    <span class="sns_line"></span>
                    <p>SNS으로 간편하게 로그인</p>
                    <span class="sns_line"></span>
                </div>

                <div class="sns_list">
                    <a href="#" class="sns_btn" aria-label="카카오톡 로그인">
                        <img src="img/kakao.svg" alt="">
                    </a>
                    <a href="#" class="sns_btn" aria-label="네이버 로그인">
                        <img src="img/naver.svg" alt="">
                    </a>
                    <a href="#" class="sns_btn" aria-label="애플 로그인">
                        <img src="img/apple_logo_icon_147318 1.svg" alt="">
                    </a>
                    <a href="#" class="sns_btn" aria-label="삼성카드 로그인">
                        <img src="img/samsung.svg" alt="">
                    </a>
                </div>
            </section>
        </main>
    </div>
    <script>
        const themeSelect = document.querySelector("#theme-select");
        const themeStyle = document.querySelector("#theme-style");
        const pageWrap = document.querySelector("#wrap");

        const themeList = [
            "neo-brutalism",
            "pixel-art",
            "claymorphism",
            "glassmorphism"
        ];

        function changeTheme(themeName) {
            if (!themeList.includes(themeName)) return;

            // 선택한 테마의 CSS 파일 연결
            themeStyle.href = "css/" + themeName + ".css";

            // 기존 테마 클래스 제거 후 새 테마 클래스 적용
            pageWrap.classList.remove(...themeList);
            pageWrap.classList.add(themeName);
        }

        // 셀렉트 메뉴에서 테마를 선택하면 디자인 변경
        themeSelect.addEventListener("change", function () {
            changeTheme(this.value);
        });

        // 페이지가 처음 열릴 때 현재 선택된 테마 적용
        changeTheme(themeSelect.value);
    </script>
</body>
</html>
