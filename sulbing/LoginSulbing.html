<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../font/css/NotoSansKR.css">
    <link rel="stylesheet" href="../css/pretendardvariable.css">
    <link rel="stylesheet" href="css/sulbing.css">

    <title>설빙 로그인</title>
</head>
<body>
    <div id="wrap">
        <header class="login_header">
            <button type="button" class="back_btn">
                <span class="sr-only">뒤로가기</span>
            </button>
        </header>

        <main>
            <div class="brand_logo">
                <img src="img/SuLBING-LOGO.svg" alt="설빙">
            </div>

            <section class="login_content">
                <h1 class="sr-only">설빙 로그인</h1>

                <form class="login_form">
                    <fieldset>
                        <legend class="sr-only">이메일 로그인</legend>

                        <div class="input_group">
                            <label for="user-email">이메일 로그인</label>
                            <input
                                type="email"
                                id="user-email"
                                name="user-email"
                                placeholder="아이디(이메일)을 입력해 주세요."
                                autocomplete="email"
                            >

                            <div class="password_box">
                                <input
                                    type="password"
                                    id="user-password"
                                    name="user-password"
                                    placeholder="비밀번호를 입력해 주세요."
                                    autocomplete="current-password"
                                    aria-label="비밀번호"
                                >
                                <div class="password_actions">
                                    <button type="button" class="delete_btn">
                                        <span class="sr-only">입력 삭제</span>
                                    </button>
                                    <button type="button" class="eye_btn">
                                        <span class="sr-only">비밀번호 보기</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="login_actions">
                            <div class="option_list">
                                <label class="check_item">
                                    <input type="checkbox" name="auto-login">
                                    <span class="check_box"></span>
                                    <span>자동 로그인</span>
                                </label>

                                <label class="check_item">
                                    <input type="checkbox" name="save-id">
                                    <span class="check_box"></span>
                                    <span>아이디 저장</span>
                                </label>
                            </div>

                            <button type="submit" class="login_btn" disabled>
                                로그인
                            </button>

                            <nav class="account_links" aria-label="계정 메뉴">
                                <a href="#">아이디 찾기</a>
                                <span class="link_line" aria-hidden="true"></span>
                                <a href="#">비밀번호 재설정</a>
                                <span class="link_line" aria-hidden="true"></span>
                                <a href="#">회원가입</a>
                            </nav>
                        </div>
                    </fieldset>
                </form>
            </section>

            <section class="sns_login">
                <div class="sns_title">
                    <span class="sns_line"></span>
                    <p>SNS으로 간편하게 로그인</p>
                    <span class="sns_line"></span>
                </div>

                <div class="sns_list">
                    <div class="sns_list">
                        <a href="#"><span class="sr-only">카카오로그인</span></a>
                        <a href="#"><span class="sr-only">네이버로그인</span></a>
                        <a href="#"><span class="sr-only">애플로그인</span></a>
                        <a href="#"><span class="sr-only">삼성카드로그인</span></a>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
