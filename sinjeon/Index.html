<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신전떡볶이리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../css/pretendardvariable.css">
    <link rel="stylesheet" href="CSS/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/SINJEON.png" alt="배너" class="pc">
                            <img src="img/kimari.png" alt="모바일" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/Frame 23.png" alt="신전" class="pc">
                            <img src="img/SINJEONmoba.png" alt="모바일신전건물" class="mo">
                        </div>
                    </div>
                    <!-- If we need pagination -->
                    <div class="swiper-pagination"></div>

                    <!-- If we need navigation buttons -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>

                    <!-- If we need scrollbar -->
                    <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const swiperHero = new Swiper('.hero-sec > .swiper', {
            // Optional parameters
            direction: 'horizontal',
            loop: true,

            // If we need pagination
            pagination: {
                el: '.visual .swiper-pagination',
            },

            // Navigation arrows
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },

            // And if we need scrollbar
            scrollbar: {
                el: '.visual .swiper-scrollbar',
            },
        });
    </script>
</body>
</html>
