<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>신전떡볶이 리뉴얼 포트폴리오</title>

    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../css/pretendardvariable.css">
    <link rel="stylesheet" href="CSS/main.css">
</head>
<body>
    <div id="wrap">
        <header class="site-header">
            <div class="header-inner">
                <a class="brand-logo" href="#" aria-label="신전떡볶이 홈">
                    <img src="img/LOGO.svg" alt="신전떡볶이">
                </a>

                <nav aria-label="주요 메뉴">
                    <ul class="gnb">
                        <li><button type="button" class="gnb-trigger" aria-expanded="false" aria-controls="mega-menu" data-menu="menu">메뉴</button></li>
                        <li><button type="button" class="gnb-trigger" aria-expanded="false" aria-controls="mega-menu" data-menu="store">매장 찾기</button></li>
                        <li><button type="button" class="gnb-trigger" aria-expanded="false" aria-controls="mega-menu" data-menu="brand">브랜드</button></li>
                        <li><button type="button" class="gnb-trigger" aria-expanded="false" aria-controls="mega-menu" data-menu="app">신전 APP</button></li>
                        <li><button type="button" class="gnb-trigger" aria-expanded="false" aria-controls="mega-menu" data-menu="news">소식</button></li>
                        <li><button type="button" class="gnb-trigger" aria-expanded="false" aria-controls="mega-menu" data-menu="customer">고객센터</button></li>
                    </ul>
                </nav>
            </div>

            <div class="mega-menu" id="mega-menu" hidden>
                <div class="mega-menu-inner">
                    <div class="mega-menu-column" data-column="menu">
                        <h2>메뉴</h2>
                        <a href="#menu">전체메뉴</a>
                        <a href="#set-menu">세트메뉴</a>
                        <a href="#new-menu">신메뉴</a>
                        <a href="#side-menu">사이드</a>
                    </div>
                    <div class="mega-menu-column" data-column="store">
                        <h2>매장 찾기</h2>
                        <a href="#store">국내 매장</a>
                        <a href="#overseas-store">해외 매장</a>
                    </div>
                    <div class="mega-menu-column" data-column="brand">
                        <h2>브랜드</h2>
                        <a href="#brand">신전 소개</a>
                        <a href="#features">신전의 특징</a>
                        <a href="#history">회사 연혁</a>
                        <a href="#font">신전 떡볶이체</a>
                        <a href="#character">신전 캐릭터</a>
                        <a href="#quality">품질 안전</a>
                    </div>
                    <div class="mega-menu-column" data-column="app">
                        <h2>신전 APP</h2>
                        <a href="#app">APP 소개</a>
                        <a href="#benefits">혜택</a>
                        <a href="#app-download">APP 다운로드</a>
                    </div>
                    <div class="mega-menu-column" data-column="news">
                        <h2>소식</h2>
                        <a href="#sns">SNS</a>
                        <a href="#events">이벤트</a>
                        <a href="#notice">공지사항</a>
                    </div>
                    <div class="mega-menu-column" data-column="customer">
                        <h2>고객센터</h2>
                        <a href="#voice">고객의 소리</a>
                        <a href="#questions">질문</a>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <section class="hero-sec" aria-label="신전떡볶이 메인 영상">
                <div class="visual">
                    <video class="hero-video" autoplay muted loop playsinline preload="metadata" aria-label="신전떡볶이 브랜드 영상">
                        <source src="video/videosinjeon.mp4" type="video/mp4">
                        현재 브라우저에서는 동영상을 재생할 수 없습니다.
                    </video>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <small>&copy; 신전떡볶이 리뉴얼 포트폴리오</small>
        </footer>
    </div>

    <script>
        const menuButtons = document.querySelectorAll(".gnb-trigger");
        const megaMenu = document.querySelector("#mega-menu");
        const menuColumns = document.querySelectorAll(".mega-menu-column");

        function closeMegaMenu() {
            megaMenu.hidden = true;
            menuButtons.forEach((button) => button.setAttribute("aria-expanded", "false"));
        }

        menuButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const wasOpen = button.getAttribute("aria-expanded") === "true";
                closeMegaMenu();

                if (!wasOpen) {
                    megaMenu.hidden = false;
                    button.setAttribute("aria-expanded", "true");
                    menuColumns.forEach((column) => {
                        column.hidden = false;
                    });
                }
            });
        });

        document.addEventListener("click", (event) => {
            if (!event.target.closest(".site-header")) {
                closeMegaMenu();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeMegaMenu();
            }
        });

        megaMenu.addEventListener("click", (event) => {
            if (event.target.closest("a")) {
                closeMegaMenu();
            }
        });
    </script>
</body>
</html>
