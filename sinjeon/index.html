<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신전떡볶이 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../css/pretendardvariable.css">
    <link rel="stylesheet" href="CSS/main.css">
    <style>
        /* 컨트롤을 배너 위에 겹치고 배경은 투명하게 처리 */
        .hero-sec {
            position: relative;
        }

        .hero-sec .visual-controls {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 5;
            background: transparent;
        }

        /* 진행 막대 뒤에 회색 바탕이 보이지 않도록 처리 */
        .hero-sec .visual-controls .swiper-scrollbar {
            background: transparent;
            box-shadow: none;
        }
    </style>
    <script src="../npm/swiper/swiper-bundle.min.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new Swiper('.hero-sec > .swiper', {
                direction: 'horizontal',
                loop: true,
                navigation: {
                    nextEl: '.visual-controls .visual-arrow-next',
                    prevEl: '.visual-controls .visual-arrow-prev',
                },
                scrollbar: {
                    el: '.visual-controls .swiper-scrollbar',
                    draggable: true,
                },
            });
        });
    </script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <section class="hero-sec" aria-label="메인 배너">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/SINJEON.png" alt="신전떡볶이 메인 배너" class="pc">
                            <img src="img/kimari.png" alt="신전떡볶이 모바일 배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/pckimari.png" alt="신전떡볶이 배너" class="pc">
                            <img src="img/SINJEONmoba.png" alt="신전떡볶이 건물 모바일 배너" class="mo">
                        </div>
                    </div>
                </div>

                <div class="visual-controls" aria-label="배너 슬라이더 조작">
                    <button type="button" class="visual-arrow visual-arrow-prev" aria-label="이전 배너"></button>
                    <div class="swiper-scrollbar" aria-label="배너 진행 상태"></div>
                    <button type="button" class="visual-arrow visual-arrow-next" aria-label="다음 배너"></button>
                </div>
            </section>
        </main>
        <footer>&copy;</footer>
    </div>
</body>
</html>
